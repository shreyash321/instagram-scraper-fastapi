services:
  - type: web
    name: instagram-scraper-fastapi
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PORT
        value: 8000
      - key: INSTAGRAM_SESSION_ID
        sync: false
